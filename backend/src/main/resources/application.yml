spring:
  application:
    name: intentguard-gateway

  datasource:
    url: jdbc:mysql://localhost:3306/agentfirewall?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: agentfirewall
    password: agentfirewall
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: 8080

intentguard:
  control-plane:
    api-key: ${INTENTGUARD_CONTROL_PLANE_API_KEY:intentguard-control-plane-secret-key}

logging:
  level:
    io.intentguard: INFO
