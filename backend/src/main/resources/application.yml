spring:
  application:
    name: intentguard-gateway

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/intentguard?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:intentguard}
    password: ${DB_PASSWORD:intentguard}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    io.intentguard: INFO
